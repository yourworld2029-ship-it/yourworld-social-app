kind = "web"
previewPath = "/"
title = "YourWorld"
description = "A social and creator platform for sharing posts, moments, reels, messages, and community experiences, with profiles, channels, notifications, and creator monetization."
version = "1.0.0"
id = "artifacts/yourworld"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25605

[services.development]
run = "pnpm --filter @workspace/yourworld run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/yourworld", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
NITRO_PRESET = "node-server"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/yourworld/server/index.mjs" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "25605"
NITRO_HOST = "0.0.0.0"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "25605"
BASE_PATH = "/"